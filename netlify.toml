[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  # Public by design: NEXT_PUBLIC_* values are bundled into the site, and
  # CONTACT_TO_EMAIL is the public address already shown on the site and CV,
  # so Netlify secrets scanner must not fail the build on them.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SANITY_PROJECT_ID,NEXT_PUBLIC_SANITY_DATASET,NEXT_PUBLIC_SITE_URL,CONTACT_TO_EMAIL"
